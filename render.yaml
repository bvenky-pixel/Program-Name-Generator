services:
  - type: web
    name: naming-intelligence-engine
    runtime: node
    buildCommand: npm install
    startCommand: npm run build && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        fromService:
          type: web
          property: url
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: meta-llama/llama-3.3-70b-instruct:free,openai/gpt-oss-120b:free
      - key: OPENROUTER_MAX_TOKENS
        value: "8000"
      - key: LLM_TIMEOUT_MS
        value: "300000"
      - key: DB_PATH
        value: /var/data/app.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
